name: Publish

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to NPM'
        type: boolean
        default: true
      publish_docker:
        description: 'Publish to Docker'
        type: boolean
        default: true

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_npm == true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install

      - name: Build & Publish to NPM
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    runs-on: ubuntu-latest
    needs: [publish-npm]
    if: |
      always() &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/') || inputs.publish_docker == true)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Wait for NPM package propagation
        if: needs.publish-npm.result == 'success'
        run: |
          VERSION="${{ steps.pkg_version.outputs.version }}"
          echo "Waiting for @eoasmxd/freya@${VERSION} to be available on NPM..."
          for i in {1..30}; do
            if npm view "@eoasmxd/freya@${VERSION}" version > /dev/null 2>&1; then
              echo "Package @eoasmxd/freya@${VERSION} is now available!"
              exit 0
            fi
            echo "Package not yet available, retrying in 10s ($i/30)..."
            sleep 10
          done
          echo "Error: Timeout waiting for package propagation on NPM."
          exit 1

      - name: Set up QEMU for multi-platform emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/freya
          tags: |
            type=raw,value=${{ steps.pkg_version.outputs.version }}
            type=raw,value=latest

      - name: Build and Push Multi-Platform Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FREYA_VERSION=${{ steps.pkg_version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=freya
          cache-to: type=gha,mode=max,scope=freya
