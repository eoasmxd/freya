name: Publish

on:
  workflow_dispatch:
    inputs:
      publish_docker_edge:
        description: 'Publish Docker edge image (ghcr.io:edge)'
        type: boolean
        default: true
      publish_docker_release:
        description: 'Publish Docker release image (GHCR & Docker Hub: latest + version)'
        type: boolean
        default: false
      publish_npm:
        description: 'Publish packages to NPM'
        type: boolean
        default: false
      publish_release:
        description: 'Publish GitHub Release'
        type: boolean
        default: false

jobs:
  publish-docker:
    name: Build & Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    if: (inputs.publish_docker_edge == true || inputs.publish_docker_release == true) && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg_version
        if: inputs.publish_docker_release == true
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU for multi-platform emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: inputs.publish_docker_release == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (edge)
        id: meta_edge
        if: inputs.publish_docker_edge == true
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge

      - name: Build and Push Multi-Platform Docker Image (edge)
        if: inputs.publish_docker_edge == true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_edge.outputs.tags }}
          labels: ${{ steps.meta_edge.outputs.labels }}
          cache-from: type=gha,scope=freya
          cache-to: type=gha,mode=max,scope=freya

      - name: Extract Docker Metadata (release)
        id: meta_release
        if: inputs.publish_docker_release == true
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME }}/freya
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.pkg_version.outputs.version }}

      - name: Build and Push Multi-Platform Docker Image (release)
        if: inputs.publish_docker_release == true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_release.outputs.tags }}
          labels: ${{ steps.meta_release.outputs.labels }}
          cache-from: type=gha,scope=freya
          cache-to: type=gha,mode=max,scope=freya

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: inputs.publish_npm == true && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install

      - name: Build & Publish to NPM
        run: pnpm release

  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: inputs.publish_release == true && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: v${{ steps.pkg_version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


