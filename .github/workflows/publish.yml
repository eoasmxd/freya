name: Publish

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (edge: test build, only ghcr.io:edge; release: official release with npm & ghcr.io:latest)'
        type: choice
        options:
          - edge
          - release
        default: edge
      publish_npm:
        description: 'Publish packages to NPM (only effective for release channel)'
        type: boolean
        default: false

jobs:
  publish-docker:
    name: Build & Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine Release Channel
        id: channel
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "mode=release" >> $GITHUB_OUTPUT
          else
            echo "mode=${{ github.event.inputs.channel || 'edge' }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU for multi-platform emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.channel.outputs.mode == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ steps.channel.outputs.mode == 'release' && format('{0}/freya', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=edge,enable=${{ steps.channel.outputs.mode == 'edge' }}
            type=raw,value=latest,enable=${{ steps.channel.outputs.mode == 'release' }}
            type=raw,value=${{ steps.pkg_version.outputs.version }},enable=${{ steps.channel.outputs.mode == 'release' }}


      - name: Build and Push Multi-Platform Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=freya
          cache-to: type=gha,mode=max,scope=freya

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [publish-docker]
    if: |
      (startsWith(github.ref, 'refs/tags/') || inputs.publish_npm == true) &&
      (github.event.inputs.channel == 'release' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install

      - name: Build & Publish to NPM
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

